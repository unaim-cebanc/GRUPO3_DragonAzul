<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="{{ url_for('static', filename='js/subir_receta.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/subir_receta.css') }}">
    <title>Subir Receta</title>
</head>
<body>
    <header>
        <div class="header_content">
            <img src="/static/images/logo.png" alt="logo.png">
            <p>mump.26</p>
        </div>
        <div class="header_translate">
            <button onclick="toggleLang()" id="langBtn"> English </button>
        </div>
        </header>
    <nav>
        <div class="nav_links">
            <a href="/" data-i18n="nav_inicio">INICIO</a>
            <a href="/sobre_nosotros" data-i18n="nav_nosotros">SOBRE NOSOTROS</a>
            <a href="/recetario" data-i18n="nav_recetario">RECETARIO</a>
            <a href="/integrantes" data-i18n="nav_integrantes">INTEGRANTES</a>
        </div>
        {%if session['usuario'] %}
            <div class="nav_sesion">
                <a href="/cerrar_sesion" data-i18n="nav_cerrar">CERRAR SESIÓN</a>
            </div>
        {%else%}
            <div class="nav_sesion">
                <a href="/inicio_sesion" data-i18n="nav_iniciar">INICIAR SESIÓN</a>
            </div>
        {%endif%}
    </nav>
    <main>
        <h1>SUBIR RECETA</h1>
        <section>
            <form action="/subir_receta" enctype="multipart/form-data" method="post">
                <div class="seccion_titulo">
                    <label for="nombre">Título:</label>
                    <input type="text" name="nombre" id="nombre" placeholder="Insertar título" required>
                </div>
                <div class="seccion_imagen">
                    <label for="imagen">Subir imagen:</label>
                    <input type="file" name="imagen" id="imagen" accept=".png, .jpg, .jpeg">
                </div>
                <div class="seccion_desc">
                    <label for="descripcion">Descripción:</label>
                    <textarea name="descripcion" placeholder="Introduce una descripcion" required></textarea>
                </div>
                <div class="seccion_ingrediente">
                    <label for="ingredientes">Ingredientes: </label>
                    <div id="container_ingrediente">
                        <div>
                            <input type="text" name="ingredientes[]" id="ingredeintes" placeholder="Introduce el ingredietne" required>
                            <label for="cantidad" class="inner_label">Cantidad:</label>
                            <input type="number" name="cantidad[]" id="cantidad" min="0" max="999">
                            <label for="unidad" class="inner_label">Unidad:</label>
                            <select name="unidad[]" id="unidad">
                                <option value="mg">mg</option>
                                <option value="g">g</option>
                                <option value="ml">ml</option>
                                <option value="l">l</option>
                                <option value="cda.">cda.</option>
                                <option value="cdta.">cdta.</option>
                                <option value="none" selected></option>
                            </select>
                        </div>
                    </div>
                    <input type="button" value="Añadir ingrediente" onclick="añadirIngrediente()">
                </div>
                <div class="seccion_pasos">
                    <label for="pasos">Pasos:</label>
                    <div id="container_paso">
                        <textarea name="pasos[]" id="pasos" placeholder="Introduce el paso" required></textarea>
                    </div>
                    <input type="button" value="Añadir paso" onclick="añadirPaso()">
                </div>
                <div class="seccion_tiempo">
                    <label for="tiempo_preparacion">Tiempo de preparación (min):</label>
                    <input type="number" name="tiempo_preparacion" id="tiempo_preparacion" min="0" max="9999" required>
                </div>
                <div class="seccion_tipo">
                    <label for="tipo">Tipo:</label>
                    <select name="tipo" id="tipo">
                        <option value="normal">Normal</option>
                        <option value="vegetariana">Vegetariana</option>
                        <option value="vegana">Vegana</option>
                    </select>
                </div>
                <input type="submit" value="Subir">
            </form>
        </section>
    </main>
    <footer>
        <div class="footer-content">
            <p class="footer-title">Contacto</p>
            <div class="footer-links">
                <a href="mailto:gastrolab@gmail.com">📧 dragonazul@gmail.com</a>
                <a href="https://instagram.com/gastrolab" target="_blank">📸 @mump.26</a>
                <a href="https://github.com/dragonazul" target="_blank">💻 Our GitHub</a>
            </div>
            <p class="footer-copy">© 2026 GastroLab · Dragon Azul</p>
        </div>
    </footer>
</body>
</html>
